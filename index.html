<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Classification Gallery</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background-color: #fff;
            border: 2px solid #007BFF;
            color: #007BFF;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #007BFF;
            color: #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .model-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .model-card:hover {
            transform: translateY(-5px);
        }
        .model-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e0e0e0;
        }
        .model-info {
            padding: 15px;
        }
        .model-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .tag {
            display: inline-block;
            background: #eef2f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Benthic & Terrestrial 3D Models</h1>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="massive">Massive Corals</button>
            <button class="filter-btn" data-filter="brain">Brain Corals</button>
            <button class="filter-btn" data-filter="terrestrial">Terrestrial</button>
            <button class="filter-btn" data-filter="invertebrate">Invertebrates</button>
        </div>
    </div>

    <div class="gallery" id="gallery">
        <!-- Project 145 Example -->
        <div class="model-card" data-category="massive">
            <img src="placeholder-145.jpg" alt="Project 145 Thumbnail">
            <div class="model-info">
                <h3>Project 145</h3>
                <span class="tag">Massive / Boulder Coral</span>
                <p><strong>Genus:</strong> <em>Orbicella</em></p>
            </div>
        </div>

        <!-- Project 188 Example -->
        <div class="model-card" data-category="brain">
            <img src="placeholder-188.jpg" alt="Project 188 Thumbnail">
            <div class="model-info">
                <h3>Project 188</h3>
                <span class="tag">Brain Coral</span>
                <p><strong>Genus:</strong> <em>Pseudodiploria</em></p>
            </div>
        </div>

        <!-- Project 522 Example -->
        <div class="model-card" data-category="terrestrial">
            <img src="placeholder-522.jpg" alt="Project 522 Thumbnail">
            <div class="model-info">
                <h3>Project 522</h3>
                <span class="tag">Terrestrial Mammal</span>
                <p><strong>Genus:</strong> <em>Bradypus</em></p>
            </div>
        </div>

        <!-- Project 609 Example -->
        <div class="model-card" data-category="invertebrate">
            <img src="placeholder-609.jpg" alt="Project 609 Thumbnail">
            <div class="model-info">
                <h3>Project 609</h3>
                <span class="tag">Horseshoe Crab</span>
                <p><strong>Genus:</strong> <em>Limulus</em></p>
            </div>
        </div>
    </div>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.model-card');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button state
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Filter logic
                const filterValue = btn.getAttribute('data-filter');
                cards.forEach(card => {
                    if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
